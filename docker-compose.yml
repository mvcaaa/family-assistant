name: family-assistant

services:
  family-assistant:
    build: .
    image: ghcr.io/mvcaaa/family-assistant:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "8787"
    volumes:
      - family-data:/data
    ports:
      - "127.0.0.1:${PUBLISH_PORT:-8787}:8787"

volumes:
  family-data:
